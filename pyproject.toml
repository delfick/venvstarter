[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "venvstarter"
dynamic = ["version"]
description = "Tool to create virtualenvs, manage versions of packages in it and use it start a particular program"
readme = "README.rst"
license = "MIT"
authors = [
    { name = "Stephen Moore", email = "github@delfick.com" },
]

[project.optional-dependencies]
tests = [
    "pytest-helpers-namespace==2021.12.29",
    "pytest-parallel==0.1.1",
    "pytest>=7.2.0",
]

[project.urls]
Homepage = "https://github.com/delfick/venvstarter"

[tool.hatch.version]
path = "_venvstarter/version.py"

[tool.hatch.build]
include = [
    "/_venvstarter",
    "/venvstarter.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "/_venvstarter",
    "/venvstarter.py",
]

[tool.hatch.build.targets.wheel]
include = [
    "/_venvstarter",
    "/venvstarter.py",
]

[tool.ruff]
# Always generate Python 3.10-compatible code.
target-version = "py310"
